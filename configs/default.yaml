app:
  name: agent-network
  environment: local

llm:
  default_provider: siliconflow
  default_model: deepseek-ai/DeepSeek-V4-Pro
  temperature: 0.1
  max_tokens: 1600
  timeout_seconds: 60
  retry_attempts: 2
  mode: auto
  providers:
    siliconflow:
      api_key_env: SILICONFLOW_API_KEY
      base_url_env: SILICONFLOW_BASE_URL
      api_base: https://api.siliconflow.cn/v1
      litellm_provider: openai
      models:
        reviewer: deepseek-ai/DeepSeek-V4-Pro
        reasoner: deepseek-ai/DeepSeek-R1
        flash: deepseek-ai/DeepSeek-V4-Flash
        glm: zai-org/GLM-5.2
        qwen_security: Qwen/Qwen3.6-35B-A3B
    deepseek_official:
      api_key_env: DEEPSEEK_API_KEY
      base_url_env: DEEPSEEK_BASE_URL
      base_url_required: true
      litellm_provider: openai
    dashscope_official:
      api_key_env: DASHSCOPE_API_KEY
      base_url_env: DASHSCOPE_BASE_URL
      base_url_required: true
      litellm_provider: openai
    openai:
      api_key_env: OPENAI_API_KEY
      api_base: null
      models:
        reviewer: gpt-4o-mini
    deepseek:
      api_key_env: DEEPSEEK_API_KEY
      api_base: null
      litellm_provider: deepseek
      models:
        reviewer: deepseek/deepseek-chat
        reasoner: deepseek/deepseek-reasoner
    glm:
      api_key_env: ZAI_API_KEY
      api_base: https://open.bigmodel.cn/api/paas/v4
      litellm_provider: openai
      models:
        reviewer: openai/glm-4-flash

profiles:
  balanced:
    fact:
      provider: siliconflow
      model: deepseek-ai/DeepSeek-V4-Pro
      timeout_seconds: 90
    security:
      provider: siliconflow
      model: Qwen/Qwen3.6-35B-A3B
      timeout_seconds: 180
    logic:
      provider: siliconflow
      model: deepseek-ai/DeepSeek-V4-Flash
      timeout_seconds: 120
    merge:
      provider: siliconflow
      model: zai-org/GLM-5.2
      timeout_seconds: 120
  long-report:
    retry_attempts: 1
    fact:
      provider: siliconflow
      model: deepseek-ai/DeepSeek-V4-Pro
      timeout_seconds: 600
      max_tokens: 2400
    security:
      provider: siliconflow
      model: Qwen/Qwen3.6-35B-A3B
      timeout_seconds: 240
      max_tokens: 3200
      reasoning_mode: provider_default
      json_mode: disabled
      provider_capability_status: unverified_for_model
    logic:
      provider: siliconflow
      model: deepseek-ai/DeepSeek-V4-Flash
      timeout_seconds: 600
      max_tokens: 3200
    merge:
      provider: siliconflow
      model: zai-org/GLM-5.2
      timeout_seconds: 240
      max_tokens: 2400
  high_reasoning:
    security:
      provider: siliconflow
      model: deepseek-ai/DeepSeek-R1
      timeout_seconds: 240

review:
  default_provider: siliconflow
  enabled_agents:
    - fact
    - security
    - logic
  agents:
    fact:
      provider: siliconflow
      model: deepseek-ai/DeepSeek-V4-Pro
      timeout_seconds: 90
    security:
      provider: siliconflow
      model: Qwen/Qwen3.6-35B-A3B
      timeout_seconds: 180
    logic:
      provider: siliconflow
      model: deepseek-ai/DeepSeek-V4-Flash
      timeout_seconds: 120
    merge:
      provider: siliconflow
      model: zai-org/GLM-5.2
      timeout_seconds: 120
  output_formats:
    - markdown
    - json

# This independent configuration is used only by the dual Fact public-pilot adapter.
# It does not change the four-agent workflow's providers or call count.
fact_review:
  reviewers:
    fact_a:
      provider: deepseek_official
      model: deepseek-v4-pro
      timeout_seconds: 90
      max_tokens: 2400
      retry_attempts: 0
      request_options:
        response_format:
          type: json_object
    fact_b:
      provider: dashscope_official
      model: qwen3.7-plus
      timeout_seconds: 180
      max_tokens: 2200
      retry_attempts: 0
      request_options:
        enable_thinking: null

evidence:
  fact_agent:
    enabled: false
    provider: fixture
    top_k: 5
    max_chars_per_evidence: 1600
    max_total_evidence_chars: 6000
    allow_network: false
    local_cache:
      cache_directory: null
      document_ids: []
      product: null
      component: null
      document_type: null
      max_documents: 3
      max_chunks_per_document: 0
      min_documents_in_results: 1
      min_score: 0.0
      min_matched_terms: 1
      exclude_navigation_like: false
    claim_verification:
      enabled: false
      max_claims: 8
      minimum_claim_characters: 20
      maximum_claim_characters: 1000
      include_headings: false
      include_list_items: true
      include_table_rows: true
      verification_mode: candidate_only
  document_sources:
    rancher:
      mode: catalog_only
      domains:
        - ranchermanager.docs.rancher.com
        - rancher.com
        - fleet.rancher.io
      products:
        - rancher_manager
        - fleet
      fetcher:
        timeout_seconds: 20
        maximum_response_bytes: 1000000
        maximum_redirects: 3
        user_agent: agent-network-document-fetcher/0.3

future_integrations:
  mcp:
    enabled: false
  github:
    enabled: false
  kubernetes:
    enabled: false
  docker:
    enabled: false
